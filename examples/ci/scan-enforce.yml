name: TodoScope enforce

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: TodoScope gate (fail above 10 findings)
        run: uvx todoscope . --quiet --fail-count 10