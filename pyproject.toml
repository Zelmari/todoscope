[project]
name = "todoscope"
version = "0.9.2"
description = "Find maintenance comments in source code and optionally interpret them with AI, without ever sending source code."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Zelmari", email = "240836003+Zelmari@users.noreply.github.com" }
]
keywords = ["todo", "comments", "scanner", "cli", "maintenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.0.0",
    "pathspec>=1.1.1",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
]

[project.urls]
Repository = "https://github.com/Zelmari/todoscope"

[project.scripts]
todoscope = "todoscope.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
