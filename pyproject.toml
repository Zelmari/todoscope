[project]
name = "todoscope"
version = "0.1.0"
description = "Find maintenance comments in source code."
readme = "README.md"
authors = [
    { name = "Zelmari", email = "240836003+Zelmari@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tree-sitter-language-pack>=1.14.3",
]

[project.scripts]
todoscope = "todoscope.cli:entrypoint"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
