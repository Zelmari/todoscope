name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to publish (e.g. v0.5.0)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Require a version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ github.event.inputs.ref }}" in
            v*) ;;
            *) echo "workflow_dispatch ref must be a v* tag" >&2; exit 1 ;;
          esac
      - name: Build
        run: uv build
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.event.inputs.ref, 'v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.ref || github.ref_name }}
          files: dist/*
          generate_release_notes: true
